<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Results Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            margin-bottom: 10px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .controls label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .controls input, .controls select {
            padding: 5px 10px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        
        #searchBox {
            width: 200px;
        }
        
        .stats {
            color: #ecf0f1;
            font-size: 14px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .image-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        
        .image-card.hidden {
            display: none;
        }
        
        .image-header {
            background-color: #34495e;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
        }
        
        .image-container {
            position: relative;
            cursor: pointer;
        }
        
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Modal for full-size image */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }
        
        .modal-content {
            margin: auto;
            display: block;
            max-width: 95%;
            max-height: 95%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: #ff0000;
        }
        
        .nav-buttons {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: white;
            cursor: pointer;
            padding: 20px;
            user-select: none;
        }
        
        .nav-buttons:hover {
            background-color: rgba(255,255,255,0.1);
        }
        
        .prev {
            left: 20px;
        }
        
        .next {
            right: 20px;
        }
        
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Fit Results Viewer</h1>
        <div class="controls">
            <label>
                Search Bin:
                <input type="text" id="searchBox" placeholder="e.g., 247">
            </label>
            <label>
                Images per row:
                <select id="columnsSelect">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </label>
            <span class="stats">
                Showing <span id="visibleCount">0</span> of <span id="totalCount">0</span> images
            </span>
        </div>
    </div>
    
    <div class="gallery" id="gallery">
        <!-- Images will be inserted here -->
    </div>
    
    <!-- Modal for full-size image -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <span class="nav-buttons prev">&#10094;</span>
        <span class="nav-buttons next">&#10095;</span>
        <img class="modal-content" id="modalImage">
    </div>

        const columnsSelect = document.getElementById('columnsSelect');
        const visibleCount = document.getElementById('visibleCount');
        const totalCount = document.getElementById('totalCount');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const closeBtn = document.querySelector('.close');
        const prevBtn = document.querySelector('.prev');
        const nextBtn = document.querySelector('.next');
        
        let currentImageIndex = -1;
        let visibleImages = [];
        
        // Initialize gallery
        function renderGallery() {
            gallery.innerHTML = '';
            images.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.dataset.bin = img.bin;
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="image-header">${img.label}</div>
                    <div class="image-container">
                        <img src="${img.src}" alt="${img.label}" loading="lazy">
                    </div>
                `;
                
                card.querySelector('.image-container').addEventListener('click', () => {
                    openModal(index);
                });
                
                gallery.appendChild(card);
            });
            
            updateStats();
        }
        
        // Search functionality
        searchBox.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.image-card');
            
            cards.forEach(card => {
                const binNum = card.dataset.bin;
                if (searchTerm === '' || binNum.includes(searchTerm)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
            
            updateStats();
        });
        
        // Column selection
        columnsSelect.addEventListener('change', (e) => {
            const columns = e.target.value;
            const minWidth = Math.floor(1200 / columns);
            gallery.style.gridTemplateColumns = `repeat(auto-fit, minmax(${minWidth}px, 1fr))`;
        });
        
        // Modal functions
        function openModal(index) {
            visibleImages = Array.from(document.querySelectorAll('.image-card:not(.hidden)'))
                .map(card => parseInt(card.dataset.index));
            currentImageIndex = visibleImages.indexOf(index);
            
            modal.style.display = 'block';
            modalImg.src = images[index].src;
        }
        
        function closeModal() {
            modal.style.display = 'none';
        }
        
        function showPrevImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                modalImg.src = images[visibleImages[currentImageIndex]].src;
            }
        }
        
        function showNextImage() {
            if (currentImageIndex < visibleImages.length - 1) {
                currentImageIndex++;
                modalImg.src = images[visibleImages[currentImageIndex]].src;
            }
        }
        
        function updateStats() {
            const visible = document.querySelectorAll('.image-card:not(.hidden)').length;
            visibleCount.textContent = visible;
            totalCount.textContent = images.length;
        }
        
        // Event listeners
        closeBtn.addEventListener('click', closeModal);
        prevBtn.addEventListener('click', showPrevImage);
        nextBtn.addEventListener('click', showNextImage);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'block') {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') showPrevImage();
                if (e.key === 'ArrowRight') showNextImage();
            }
        });
        
        // Initialize
        renderGallery();
    </script>
</body>
</html>
